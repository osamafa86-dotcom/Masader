# Overlay for a server that already runs a shared Caddy (the feedsnews VPS).
#
#   docker compose -f docker-compose.yml -f deploy/vps/docker-compose.vps.yml up -d --build
#
# What it changes from the standalone stack:
#   - the bundled Caddy is switched off: ports 80/443 belong to the shared one;
#   - web and api also join the shared Caddy network (deploy_default) under
#     explicit names, so the site block in masader.caddy can reach them.
# Nothing else is exposed: the database stays on the stack's private network.

services:
  caddy:
    profiles: ["standalone"]

  # Ceilings so the stack cannot starve the other sites on a shared server
  # (about 3 GB at most in total; normal use is well under half of that).
  db:
    mem_limit: 768m
  migrate:
    mem_limit: 512m
  worker:
    mem_limit: 1g
  backup:
    mem_limit: 256m

  web:
    mem_limit: 512m
    networks:
      default:
      web:
        aliases: [masader-web]

  api:
    mem_limit: 512m
    networks:
      default:
      web:
        aliases: [masader-api]

networks:
  web:
    name: ${SHARED_CADDY_NETWORK:-deploy_default}
    external: true
