[project]
name = "marsad"
version = "0.1.0"
description = "Marsad engine: monitor, extract, translate and publish strategic studies in Arabic"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=2.0",
  "pymupdf>=1.24",
  "selectolax>=0.3",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
marsad = "marsad.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marsad*"]

[tool.setuptools.package-data]
marsad = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
