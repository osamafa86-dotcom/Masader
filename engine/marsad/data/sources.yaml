- slug: isw
  name: Institute for the Study of War
  name_ar: معهد دراسة الحرب
  homepage: https://www.understandingwar.org
  kind: think_tank
  description_ar: مركز أبحاث أمريكي ينشر تقييمات يومية للعمليات العسكرية والنزاعات الجارية.
  fetch_method: listing
  feed_url: https://www.understandingwar.org/research/
  listing_config:
    item_selector: "article, .views-row, .research-item"
    link_selector: "a[href]"
    link_pattern: "/(research|backgrounder)/"
  fetch_interval_min: 60
  rights_level: c
  is_active: true
