# Source registry. rights_level: a = open licence/public domain/agreement, b = written permission, c = summary + link only.
# feed_verified: false means the feed URL was not reachable from the build environment and must be confirmed
# with `marsad sources check` (strategy plan, phase 0).
- slug: tnsr
  name: Texas National Security Review
  name_ar: مجلة تكساس لمراجعة الأمن القومي
  homepage: https://tnsr.org
  kind: journal
  description_ar: مجلة محكّمة مفتوحة الوصول تصدر عن جامعة تكساس، تُعنى بالاستراتيجية والأمن القومي والسياسة الخارجية.
  fetch_method: rss
  feed_url: https://tnsr.org/feed/
  fetch_interval_min: 360
  rights_level: a
  license: CC BY-NC 4.0
  rights_evidence: https://tnsr.org/copyright/
  is_active: true
- slug: parameters
  name: Parameters (US Army War College)
  name_ar: مجلة بارامترز (كلية الحرب للجيش الأمريكي)
  homepage: https://press.armywarcollege.edu/parameters/
  kind: journal
  description_ar: المجلة الفصلية لكلية الحرب التابعة للجيش الأمريكي في الاستراتيجية والقيادة العسكرية.
  fetch_method: rss
  feed_url: https://press.armywarcollege.edu/parameters/recent.rss
  fetch_interval_min: 720
  rights_level: a
  license: Public domain (17 U.S.C. 105)
  rights_evidence: https://press.armywarcollege.edu/parameters/publication_ethics.html
  per_item_copyright_check: true
  is_active: true
