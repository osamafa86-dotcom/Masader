# Production stack. Copy .env.example to .env, fill it in, then: docker compose up -d --build
x-engine: &engine
  build: ./engine
  restart: unless-stopped
  env_file: .env
  environment:
    MARSAD_DATABASE_URL: postgresql+psycopg://marsad:${POSTGRES_PASSWORD}@db:5432/marsad
  volumes:
    - raw_files:/data
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: marsad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marsad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marsad"]
      interval: 5s
      retries: 10

  migrate:
    <<: *engine
    restart: "no"
    command: ["sh", "-c", "marsad db-upgrade && marsad seed"]

  api:
    <<: *engine
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s

  worker:
    <<: *engine
    command: ["marsad", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-مصادر}
    restart: unless-stopped
    environment:
      ENGINE_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  raw_files:
  caddy_data:
